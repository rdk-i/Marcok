<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b12">
  <meta name="description" content="Marcok secure access gateway.">
  <title>Marcok</title>
  <style>
    :root { color-scheme: dark; --bg:#070b12; --text:#edf7ff; --muted:#a7bdcd; --cyan:#47d7ff; --blue:#718aff; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; }
    body { overflow:hidden; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body::before { content:""; position:fixed; inset:-12%; pointer-events:none; opacity:.32; background-image:linear-gradient(rgba(71,215,255,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(71,215,255,.15) 1px,transparent 1px); background-size:72px 72px; mask-image:radial-gradient(ellipse 70% 68% at 50% 38%,black 0%,rgba(0,0,0,.8) 34%,transparent 76%); -webkit-mask-image:radial-gradient(ellipse 70% 68% at 50% 38%,black 0%,rgba(0,0,0,.8) 34%,transparent 76%); }
    body::after { content:""; position:fixed; inset:0; pointer-events:none; background:radial-gradient(circle at 67% 31%,rgba(71,215,255,.12),transparent 25%),linear-gradient(115deg,transparent 35%,rgba(7,11,18,.75) 77%); }
    .shell { position:relative; z-index:1; min-height:100vh; display:grid; place-items:center; padding:32px 20px; }
    main { width:min(100%,980px); }
    .hero { max-width:760px; }
    h1 { margin:0 0 24px; font-size:clamp(72px,14vw,158px); line-height:.82; letter-spacing:-.09em; font-weight:800; background:linear-gradient(105deg,#fff 8%,#c7f2ff 55%,var(--blue) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
    p { margin:0; color:var(--muted); font-size:clamp(19px,2.6vw,28px); line-height:1.35; letter-spacing:-.035em; }
    @media (max-width:560px) { body::before { background-size:52px 52px; } h1 { font-size:22vw; } p { font-size:20px; max-width:300px; } }
  </style>
</head>
<body><div class="shell"><main><section class="hero"><h1>Marcok</h1><p>Minimal surface. Maximum control.</p></section></main></div></body>
</html>
