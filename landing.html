<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b12">
  <meta name="description" content="Marcok secure access gateway.">
  <title>Marcok // Secure Gateway</title>
  <style>
    :root { color-scheme: dark; --bg:#070b12; --panel:#0d1521; --line:#1c3144; --text:#e7f4ff; --muted:#7f9bb0; --cyan:#47d7ff; --blue:#6f8cff; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; }
    body { overflow-x:hidden; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.18; background-image:linear-gradient(rgba(71,215,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(71,215,255,.12) 1px,transparent 1px); background-size:72px 72px; mask-image:linear-gradient(to bottom,black,transparent 78%); }
    .shell { position:relative; min-height:100vh; display:grid; place-items:center; padding:32px 20px; }
    .orb { position:fixed; width:42vw; max-width:620px; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,rgba(71,215,255,.13),transparent 65%); filter:blur(12px); pointer-events:none; }
    .orb.one { top:-22vw; right:-12vw; } .orb.two { bottom:-28vw; left:-18vw; background:radial-gradient(circle,rgba(111,140,255,.11),transparent 65%); }
    main { width:min(100%,980px); position:relative; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:clamp(64px,13vh,150px); color:var(--muted); font:600 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.16em; text-transform:uppercase; }
    .brand { color:var(--text); letter-spacing:.28em; }
    .status { display:flex; align-items:center; gap:9px; }
    .dot { width:7px; height:7px; border-radius:50%; background:#66f2b0; box-shadow:0 0 16px #66f2b0; }
    .hero { max-width:770px; }
    .eyebrow { color:var(--cyan); font:600 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.22em; text-transform:uppercase; }
    h1 { margin:18px 0 20px; font-size:clamp(64px,13vw,148px); line-height:.85; letter-spacing:-.085em; font-weight:800; background:linear-gradient(110deg,#fff 12%,#b9edff 54%,#718aff 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .lead { max-width:580px; margin:0; color:#a4bbca; font-size:clamp(17px,2.2vw,23px); line-height:1.5; letter-spacing:-.02em; }
    .actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:34px; }
    a { min-height:46px; display:inline-flex; align-items:center; justify-content:center; padding:0 20px; border:1px solid var(--cyan); color:#03121b; background:var(--cyan); text-decoration:none; font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.12em; text-transform:uppercase; transition:transform .2s,box-shadow .2s,background .2s; }
    a:hover { transform:translateY(-2px); box-shadow:0 12px 34px rgba(71,215,255,.22); }
    a.secondary { color:var(--text); background:transparent; border-color:var(--line); }
    a.secondary:hover { border-color:#46677f; box-shadow:none; background:#0d1824; }
    .footer { display:flex; justify-content:space-between; gap:20px; margin-top:clamp(72px,16vh,170px); padding-top:17px; border-top:1px solid var(--line); color:#587184; font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.1em; text-transform:uppercase; }
    @media (max-width:560px) { .topbar { margin-bottom:78px; } .topbar .status { font-size:0; } .topbar .status .dot { margin-right:2px; } h1 { font-size:21vw; } .lead { font-size:17px; } .actions, a { width:100%; } .footer { margin-top:90px; flex-direction:column; gap:6px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; } }
  </style>
</head>
<body>
  <div class="orb one"></div><div class="orb two"></div>
  <div class="shell"><main>
    <header class="topbar"><div class="brand">MARCOK // 01</div><div class="status"><span class="dot"></span> SYSTEM ONLINE</div></header>
    <section class="hero" aria-labelledby="title"><div class="eyebrow">Secure access gateway</div><h1 id="title">MARCOK</h1><p class="lead">A focused, private gateway for reliable access. Minimal surface. Maximum control.</p><div class="actions"><a href="/dashboard">Open panel <span aria-hidden="true">&nbsp;→</span></a><a class="secondary" href="/sub">Subscription</a></div></section>
    <footer class="footer"><span>Connection encrypted</span><span>RDM PROXY NETWORK</span></footer>
  </main></div>
</body>
</html>
